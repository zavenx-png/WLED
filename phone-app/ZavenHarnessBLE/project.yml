name: ZavenHarnessBLE
options:
  bundleIdPrefix: com.zaven.harness
  deploymentTarget:
    iOS: "17.0"
targets:
  ZavenHarnessBLE:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "Zaven Harness"
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: "Connect to your Zaven WLED harness without Wi-Fi."
        NSLocalNetworkUsageDescription: "Connect to the local WLED controller over Wi-Fi."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
    settings:
      base:
        SWIFT_VERSION: 5.0
        PRODUCT_BUNDLE_IDENTIFIER: com.zaven.harness.ble
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
