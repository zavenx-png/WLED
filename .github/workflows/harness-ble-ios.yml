name: Harness BLE iOS app compile

on:
  push:
    branches:
      - harness-v5.3-ble-companion
    paths:
      - 'phone-app/ZavenHarnessBLE/**'
      - '.github/workflows/harness-ble-ios.yml'
  workflow_dispatch:

jobs:
  build-ios-simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: phone-app/ZavenHarnessBLE
        run: xcodegen generate
      - name: Build unsigned iOS Simulator app
        working-directory: phone-app/ZavenHarnessBLE
        run: |
          xcodebuild -project ZavenHarnessBLE.xcodeproj \
            -scheme ZavenHarnessBLE -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator app
        run: |
          find phone-app/ZavenHarnessBLE/build/Build/Products -type d -name 'ZavenHarnessBLE.app' -print
          cd phone-app/ZavenHarnessBLE/build/Build/Products/Release-iphonesimulator
          zip -qr ZavenHarnessBLE-Simulator.app.zip ZavenHarnessBLE.app
      - uses: actions/upload-artifact@v4
        with:
          name: ZavenHarnessBLE-iOS-Simulator-unsigned
          path: phone-app/ZavenHarnessBLE/build/Build/Products/Release-iphonesimulator/ZavenHarnessBLE-Simulator.app.zip
