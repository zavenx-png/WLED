name: StopWatch C152 V17.16 — 41 effects using native sound engine
on:
  push:
    branches: [stopwatch-v17-16-imported-audio-fx]
    paths:
      - 'stopwatch/StopWatchNative31V16/**'
      - '.github/workflows/stopwatch-v17-16.yml'
  workflow_dispatch:
jobs:
  build-v17-16:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install official M5Stack board and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://static-cdn.m5stack.com/resource/arduino/package_m5stack_index.json
          arduino-cli core update-index
          arduino-cli core install m5stack:esp32
          arduino-cli lib install M5Unified
          arduino-cli lib install M5GFX
      - name: Verify original 31 and 10 new menu entries and native sound engine
        run: |
          sed -i -E "s/^#define STOPWATCH_FONT_TRIAL [0-9]+/#define STOPWATCH_FONT_TRIAL 2/" stopwatch/StopWatchNative31V16/assets/FontTrial.h
          python3 - <<'PY'
          import re
          from pathlib import Path
          src=Path('stopwatch/StopWatchNative31V16/NativeApp.cpp').read_text()
          new=Path('stopwatch/StopWatchNative31V16/assets/ImportedAudioFXV1716.h').read_text()
          names=re.findall(r'"([^"]+)"', re.search(r'EFFECT_NAMES\[VIS_COUNT\] = \{(.*?)\};',src,re.S).group(1))
          old=['zaven Chromatic EQ','Robot Shuffle','Warehouse House Duo','Matrix Phosphor','zaven Psychedelic Halo',
            'zaven Electric Aurora','zaven Flowing Halo','Prism EQ','Psychedelic Bloom','Vapor Scope',
            'Frequency Towers','Radial Spectrum','Heartbeat Neon','Round Resonator','Kaleidoscope Reactor',
            'Fibonacci Sunflower','Infinity Tunnel','Cymatic Mandala','Orbital Harmonics','Nebula Particles',
            'zaven Kaleidoscope','zaven Round Resonator','zaven Fibonacci Spiral','Star Marionette',
            'Warp Drive Loom','Cosmic Patchwork Moth','Yarnfall Cathedral','Celestial Buttonwork',
            'Spiral Spindle','Aurora Fishing Net','Tidal Cable Knit']
          newnames=['Corona','Magma','Ripple Tank','Kaleido','Inferno','Spike Ball',
            'Corona Prism (variant)','Magma Reactor (variant)','Inferno Icefire (variant)','Spike Ball Nova (variant)']
          assert names==old+newnames,(len(names),names)
          ids=[int(v) for v in re.search(r'ORIGINAL_EFFECT_ID\[VIS_COUNT\]=\{([^}]+)\}',src).group(1).split(',')]
          assert ids[:31]==[23,22,20,4,24,29,30,1,2,3,6,7,8,9,10,11,12,13,17,19,25,26,27,43,44,48,49,50,51,52,53]
          assert ids[31:]==list(range(54,64)) and len(set(ids))==41
          mic=re.search(r'AUTO_MIC_TYPES\[VIS_COUNT\]=\{([^}]+)\}',src,re.S).group(1)
          assert len(re.findall(r'MIC_\w+',mic))==41
          assert 'if(renderStringFestivalV1714(id))return;' in src
          assert 'if(renderStringFestivalV1715(id))return;' in src
          assert 'if(renderImportedAudioV1716(id))return;' in src
          assert 'NFFT=512, FS=16000, NBANDS=32;' in src
          assert 'afLevel(float' in new and 'bins[i]' in new and 'beatStamp' in new
          assert 'esp_dsp' not in new and 'M5.Mic.record' not in new
          assert 'corona::AudioFeatures' not in new
          assert 'sourceCount=hasV1716?41:(hasV1715?31:' in src
          assert 'if(hasV1715)return slot<31?slot:0xff;' in src
          assert 'uint8_t oldGain[41]' in src
          assert 'prefs.putUChar("s1716",21)' in src
          nav=re.search(r'static void selectEffect\(int d\)\{(.*?)\n\}',src,re.S)
          assert nav and 'vibration(' not in nav.group(1)
          assert 'selectEffect(dx>0?-1:+1)' in src
          print('PASS: 31 original effects untouched; 10 new visual modes; one shared mic/FFT; separate V17.16 NVS and no switch haptics')
          PY
      - name: Compile for M5Stack StopWatch C152
        run: |
          mkdir -p build/v17-16
          arduino-cli compile --fqbn m5stack:esp32:m5stack_stopwatch --output-dir build/v17-16 --warnings all stopwatch/StopWatchNative31V16
          cp build/v17-16/StopWatchNative31V16.ino.bin build/v17-16/StopWatch_V17_16_41_Effects.app.bin
          mkdir -p build/v17-16/source-snapshot
          cp -R stopwatch/StopWatchNative31V16 build/v17-16/source-snapshot/
          cp .github/workflows/stopwatch-v17-16.yml build/v17-16/source-snapshot/
          cd build/v17-16
          zip -q -r StopWatch_V17_16_Editable_Source.zip source-snapshot
          sha256sum StopWatch_V17_16_41_Effects.app.bin StopWatch_V17_16_Editable_Source.zip > SHA256SUMS.txt
          ls -lh StopWatch_V17_16_41_Effects.app.bin
      - uses: actions/upload-artifact@v4
        with:
          name: StopWatch-V17-16-41-Effects-C152
          path: |
            build/v17-16/StopWatch_V17_16_41_Effects.app.bin
            build/v17-16/StopWatch_V17_16_Editable_Source.zip
            build/v17-16/SHA256SUMS.txt
          if-no-files-found: error
