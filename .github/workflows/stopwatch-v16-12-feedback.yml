name: StopWatch C152 V16.12 D Brightness/Spacing/Sync
on:
  push:
    branches: [stopwatch-v16-12-spacing-sync-brightness]
    paths:
      - 'stopwatch/StopWatchNative31V16/**'
      - '.github/workflows/stopwatch-v16-12-feedback.yml'
  workflow_dispatch:
jobs:
  build-v16-12-direct-native-text:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install official StopWatch board and M5 graphics libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://static-cdn.m5stack.com/resource/arduino/package_m5stack_index.json
          arduino-cli core update-index
          arduino-cli core install m5stack:esp32
          arduino-cli lib install M5Unified
          arduino-cli lib install M5GFX
      - name: Verify V16.12 D source contract
        run: |
          sed -i -E "s/^#define STOPWATCH_FONT_TRIAL [0-9]+/#define STOPWATCH_FONT_TRIAL 2/" stopwatch/StopWatchNative31V16/assets/FontTrial.h
          grep -Fq '#define STOPWATCH_FONT_TRIAL 2' stopwatch/StopWatchNative31V16/assets/FontTrial.h
          grep -Fq 'VIS_COUNT=24' stopwatch/StopWatchNative31V16/NativeApp.cpp
          grep -Fq 'globalname' stopwatch/StopWatchNative31V16/NativeApp.cpp
          grep -Fq 'nameTouchXSum' stopwatch/StopWatchNative31V16/NativeApp.cpp
          grep -Fq 'crispBrightnessText' stopwatch/StopWatchNative31V16/NativeApp.cpp
          grep -Fq 'one continuous set of bars' stopwatch/StopWatchNative31V16/NativeApp.cpp
          grep -Fq 'matching 12pt bold' stopwatch/StopWatchNative31V16/NativeApp.cpp
          grep -Fq 'single travel clock' stopwatch/StopWatchNative31V16/assets/FidelityClassic167.h
          grep -Fq 'clearGap=15.f' stopwatch/StopWatchNative31V16/assets/BrowserFiveRenderer.h
          grep -Fq 'Fully circular neon sunset' stopwatch/StopWatchNative31V16/assets/FidelityClassic167.h
          grep -Fq 'spiraling ribbon strands are intentionally removed' stopwatch/StopWatchNative31V16/assets/FidelityClassic167.h
          if grep -Fq 'uiButton(287,373,93,52,"CLEAR")' stopwatch/StopWatchNative31V16/NativeApp.cpp; then exit 1; fi
      - name: Compile V16.12 D for M5Stack StopWatch C152
        run: |
          mkdir -p build/v16-12-d
          arduino-cli compile --fqbn m5stack:esp32:m5stack_stopwatch --output-dir build/v16-12-d --warnings all stopwatch/StopWatchNative31V16
          cp build/v16-12-d/StopWatchNative31V16.ino.bin build/v16-12-d/StopWatch_V16_12_D_24_Effects.app.bin
          cd build/v16-12-d
          sha256sum StopWatch_V16_12_D_24_Effects.app.bin > SHA256SUMS.txt
          ls -lh StopWatch_V16_12_D_24_Effects.app.bin
      - uses: actions/upload-artifact@v4
        with:
          name: StopWatch-V16-11-D-24-Effects-C152
          path: |
            build/v16-12-d/StopWatch_V16_12_D_24_Effects.app.bin
            build/v16-12-d/SHA256SUMS.txt
          if-no-files-found: error
