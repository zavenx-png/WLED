name: Build V17.28 Art Capsule + Ghost
on:
  push:
    branches:
      - stopwatch-v17-28-art-capsule-ghost
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Verify edited source + gateway syntax
        run: |
          python3 -m py_compile stopwatch/ghost_gateway/main.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('stopwatch/StopWatchNative31V16/NativeApp.cpp').read_text()
          assert 'VIS_COUNT=32' in s
          assert '"AirDrop Art Capsule"' in s and '"Ghost Companion"' in s
          assert 'BeatLab::' not in s and 'BeatLabDSP::' not in s
          assert '90000UL' in s and 'M5.Power.powerOff()' in s
          assert 'MotionPower::tick()' in s
          assert s.count('ArtCapsule::render()')==1
          assert s.count('GhostCompanion::render()')==1
          print("Static integration checks passed")
          PY
      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
      - name: Install official StopWatch board and M5 libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://static-cdn.m5stack.com/resource/arduino/package_m5stack_index.json
          arduino-cli core update-index
          arduino-cli core install m5stack:esp32@3.3.10
          arduino-cli lib install M5Unified@0.2.29
          arduino-cli lib install M5GFX@0.2.36
      - name: Retrieve pinned ESP32Drop AirDrop library
        run: |
          git clone --quiet https://github.com/s-iwaki-d/ESP32Drop.git "$RUNNER_TEMP/esp32drop"
          git -C "$RUNNER_TEMP/esp32drop" checkout --quiet 92bdc1221924ca522f3ccbebbd9353612ce5b2d7
          test -f "$RUNNER_TEMP/esp32drop/ESP32Drop/library.properties"
      - name: Compile with AirDrop receiver + OPI PSRAM
        run: |
          mkdir -p compiled
          arduino-cli compile \
            --fqbn "m5stack:esp32:m5stack_stopwatch:PartitionScheme=huge_app,PSRAM=opi,DebugLevel=error,USBMode=default,CDCOnBoot=cdc,UploadMode=cdc" \
            --library "$RUNNER_TEMP/esp32drop/ESP32Drop" \
            --output-dir "$GITHUB_WORKSPACE/compiled" \
            "$GITHUB_WORKSPACE/stopwatch/StopWatchNative31V16"
          ls -lh compiled/*.bin
      - name: Editable source, library version, flashing guide, hashes
        run: |
          mkdir -p compiled/Editable_Source
          cp -R stopwatch/StopWatchNative31V16 compiled/Editable_Source/
          cp -R stopwatch/ghost_gateway compiled/Editable_Source/
          cp stopwatch/V17_28_README.md compiled/Editable_Source/
          printf 'ESP32Drop pinned SHA: 92bdc1221924ca522f3ccbebbd9353612ce5b2d7\n' > compiled/THIRD_PARTY_VERSION.txt
          (cd compiled && sha256sum *.bin > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: StopWatch_V17_28_Art_Capsule_Ghost_32_Effects
          path: |
            compiled/*.bin
            compiled/*.txt
            compiled/Editable_Source/
          if-no-files-found: error
          retention-days: 30
